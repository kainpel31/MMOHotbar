# Builds MMOHotbar.dll on GitHub's Windows runner, so no Visual Studio, CMake or vcpkg is
# needed on your own PC. Push to main (or hit "Run workflow") and download the result from
# the run's Artifacts box.
#
# Three things this file depends on:
#   * the runner's toolchain. windows-latest is Windows Server 2025 and its Visual Studio is
#     the 2026 one: vcpkg's own log ends up with "Compiler found: C:/Program Files/Microsoft
#     Visual Studio/18/Enterprise/VC/Tools/MSVC/14.51.36231/bin/Hostx64/x64/cl.exe", i.e.
#     MSVC 14.51 -- toolset v145 -- and the "ci" preset pins exactly that generator name.
#     There is no fallback: a configure preset must name a generator, and a name the machine
#     has no instance of dies with "could not find any instance of Visual Studio". The image's
#     README still advertises VS 2022, but CMake finds no usable VS 17 instance on it, so
#     "Visual Studio 17 2022" is not an option here either -- that was the first CI failure.
#     The "default" preset keeps "Visual Studio 17 2022" on purpose: it is the one for the
#     user's own machine, and VS 2026 does not support Windows 10 (see CMakePresets.json).
#   * CMake 4.2 or newer. The image ships 3.31.6, in which "Visual Studio 18 2026" is not a
#     known generator at all, so the step below downloads a pinned 4.x release (SHA-256
#     checked) and Configure/Build call it by absolute path. It is deliberately NOT added to
#     PATH: vcpkg must keep building the ports with the image's 3.31.6, which already did
#     that successfully, while only our own configure/build runs need the newer generator.
#     Skipping this dies at "could not find any suitable generator" -- after vcpkg has
#     already spent ~25 minutes on the dependencies.
#   * CommonLibSSE-NG is cloned and built from source rather than taken from vcpkg. The
#     vcpkg port is 3.7.0 and classifies the runtime by MINOR version (case 6 -> AE), so an
#     AE 1.7.x game would be mistaken for SE and the plugin would resolve SE offsets against
#     an AE binary -- see the comment block at the top of CMakeLists.txt.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Both are read by the CMake presets: VCPKG_ROOT by the toolchain path,
  # CommonLibSSEPath_NG by CMakeLists.txt.
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  # CommonLibSSE-NG revision to build against. Bump deliberately, not by accident.
  # alandtse/CommonLibSSE-NG -- the maintained CommonLibSSE-NG fork (v10.0.0 at this pin).
  # Every API this plugin uses was checked against this tree: RE::FormType still names 0x2E
  # AlchemyItem with no Potion member, GetFormType() returns by value, and both
  # CommonLibSSE::CommonLibSSE and the EffectSetting/TESObjectWEAP/BGSBipedObjectForm
  # members the HUD code calls are present. See HotbarHUD.cpp ItemIconLabel.
  COMMONLIBSSE_NG_COMMIT: d61bca4de789428aa7d98a770b1323ddf1bb855c
  # CMake the runner is told to use. Must be >= 4.2 for the "Visual Studio 18 2026" generator
  # the "ci" preset names, which the image's own 3.31.6 does not have. SHA-256 of the official
  # windows-x86_64 zip, from github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-SHA-256.txt.
  CMAKE_VERSION: 4.4.3
  CMAKE_ZIP_SHA256: 4d52ebab7193a698651639ed80d8d04fd903358843572cf44c7fd234cb7c26ab

jobs:
  build:
    name: Release DLL
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VCPKG_BINARY_SOURCES has to name a real directory, so it cannot sit in the
      # workflow-level env -- the "runner" context is not available there (only github,
      # inputs, secrets and vars are). Writing it into GITHUB_ENV exports it to every later
      # step instead: vcpkg's binary cache saves the first build's compiled Boost and
      # friends, and the cache step below persists that directory between runs.
      - name: Point vcpkg at its binary cache
        shell: pwsh
        run: |
          "VCPKG_BINARY_SOURCES=clear;files,$env:RUNNER_TEMP/vcpkg-cache,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Clone vcpkg
        shell: pwsh
        run: |
          # blob:none is the important flag: it brings the full commit graph -- so the
          # baseline commits pinned in vcpkg.json / vcpkg-configuration.json exist locally --
          # without downloading every historical blob. A plain --depth 1 clone cannot
          # resolve a baseline and fails.
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      - name: Clone CommonLibSSE-NG
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/alandtse/CommonLibSSE-NG.git "$env:RUNNER_TEMP/CommonLibSSE-NG"
          git -C "$env:RUNNER_TEMP/CommonLibSSE-NG" checkout $env:COMMONLIBSSE_NG_COMMIT
          git -C "$env:RUNNER_TEMP/CommonLibSSE-NG" --no-pager log -1 --format='NG at %H %s'

      - name: Cache vcpkg downloads and binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/downloads
            ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # The image's CMake (3.31.6) does not know the "Visual Studio 18 2026" generator --
      # only CMake >= 4.2 does (verified empirically: 4.4.3 lists it, 3.31.6 cannot even name
      # it). Downloaded pinned and SHA-256 checked against the release's own
      # cmake-4.4.3-SHA-256.txt. Deliberately NOT put on PATH: Configure/Build invoke it by
      # absolute path below, so vcpkg keeps using the image's 3.31.6 to build the ports --
      # which already succeeded with exactly that setup.
      - name: Install CMake 4.x
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "cmake-$($env:CMAKE_VERSION)-windows-x86_64.zip"
          $url = "https://github.com/Kitware/CMake/releases/download/v$($env:CMAKE_VERSION)/cmake-$($env:CMAKE_VERSION)-windows-x86_64.zip"
          curl.exe -sSfL --retry 3 -o $zip $url
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:CMAKE_ZIP_SHA256) {
            throw "SHA-256 mismatch for ${url}: expected $($env:CMAKE_ZIP_SHA256), got $hash"
          }
          $dest = Join-Path $env:RUNNER_TEMP 'cmake4'
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $bin = Join-Path $dest "cmake-$($env:CMAKE_VERSION)-windows-x86_64/bin"
          $ourCmake = Join-Path $bin 'cmake.exe'
          if (-not (Test-Path -LiteralPath $ourCmake)) {
            throw "cmake.exe not found at $ourCmake"
          }
          "CMAKE_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $ourCmake --version

      # Evidence trail for the 'ci' preset's description: which Visual Studio instances and
      # cmake binaries this runner actually offers, printed right before Configure uses them.
      - name: Report the Visual Studio instances
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path -LiteralPath $vswhere) {
            & $vswhere -all -products * -format json |
              ConvertFrom-Json |
              Select-Object displayName, installationVersion, installationPath |
              Format-List
          } else {
            Write-Host 'vswhere.exe not found on this runner'
          }
          Write-Host "cmake on PATH: $(cmake --version | Select-Object -First 1)"
          $ourCmake = Join-Path $env:CMAKE_BIN 'cmake.exe'
          Write-Host "pinned CMake:  $(& $ourCmake --version | Select-Object -First 1)  ($ourCmake)"

      - name: Configure
        shell: pwsh
        run: |
          # Forward slashes on purpose: CMake reads "\a" and "\t" in a Windows path as escape
          # sequences and mangles the directory before it ever looks at it.
          $ng = (Join-Path $env:RUNNER_TEMP 'CommonLibSSE-NG').Replace('\', '/')
          & "$env:CMAKE_BIN/cmake.exe" --preset ci "-DCommonLibSSEPath_NG=$ng"

      - name: Build
        shell: pwsh
        run: |
          # Same pinned CMake as Configure -- same generator, same version, no surprises.
          & "$env:CMAKE_BIN/cmake.exe" --build build --config Release --parallel

      - name: Check the plugin exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/Release/MMOHotbar.dll')) {
            throw 'build/Release/MMOHotbar.dll was not produced'
          }
          Get-ChildItem build/Release/MMOHotbar.dll, build/Release/MMOHotbar.pdb -ErrorAction SilentlyContinue |
            Format-Table Name, Length -AutoSize

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: MMOHotbar-plugin
          path: |
            build/Release/MMOHotbar.dll
            build/Release/MMOHotbar.pdb
          if-no-files-found: error

      # package.ps1 stages dist/ + fomod/ + the keycap SWFs committed under flash/ and
      # compresses the result; the runner has the 7-Zip it looks for.
      - name: Build the FOMOD installer
        shell: pwsh
        run: ./package.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: MMO-Hotbar-FOMOD
          path: package/MMO Hotbar.7z
          if-no-files-found: error
