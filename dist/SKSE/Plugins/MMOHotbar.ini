; MMOHotbar (fork of STB Hotkey System, GPL-3.0-only)
;
; If STB Hotkey System is still installed, disable it: this plugin already
; contains all of it. STB_HotkeySystem.ini is still read underneath this file as
; a base layer, so existing settings carry over -- move your edits into this
; file, then delete the old one. The co-save data (HKSY/HOTK) is loaded as-is,
; so binds you assigned before the switch are kept.
;
; Icon settings apply when you reopen the menu -- no restart needed.
; Key numbers are DirectInput scancodes: 29 = Left Ctrl, 42 = Left Shift, 56 = Left Alt.

[Assignment]

; Hold this key in a menu, then press a key to bind the selected entry.
; Cannot be the key that opens the Favorites menu -- the game warns you if it is.
; Ignored in any menu that uses the same key for one of its own controls.
iModifierScanCode = 29

; Hold this one instead to ADD the entry to that key, building a group that equips as a
; set. Press it again on a member to remove it. 0 turns groups off.
; Ignored in any menu that uses the same key for its own controls. Left Shift is SkyUI's
; "equip mode" in the container menu (hold it to eat or drink from a body), so with the
; default key, groups are built in the inventory, magic or favorites menu instead.
iGroupModifierScanCode = 42

; 0 = one key per bind, assigned the moment you press it.
; 1 = two-key combos. A second key finishes the combo; releasing the modifier after the
;     first key binds just that one.
bEnableChords = 0

; While a modifier is held, keys stop doing their usual job in the menu, so binding Ctrl+E
; does not also equip the item. The key that closes the menu always works.
bBlockMenuKeys = 1

; Ask before binding a key that already does something in the game (Activate, Ready
; Weapon...). The number keys 1-8 are never counted -- replacing those is the point.
bWarnKeyConflict = 1

; Show "Assign hotkey" among the button prompts at the bottom of the menu.
bShowAssignHint = 1


[Icons]

; Keycaps in your own inventory. Each section below has its own bShow, so you can turn
; them off here and leave them on in one menu.
bShow = 1

; Size in percent, and vertical nudge. Shared by every menu.
fScale = 75.0
fY = 2.0

; Which keycap art the list rows draw:
;   0 = Interface/STB_Keycaps.swf, clip STBKeycap  (ours; see flash/README.md)
;   1 = SkyUI's own Interface/SkyUI/buttonart.swf, clip ButtonArt
; Both are laid out the same way (Keyboard@1, Mouse@256, Gamepad@266), so this only picks
; the file. Whichever is missing simply means no key glyphs -- nothing breaks either way.
iKeycapSource = 0

; bAfterName = 1 = the keycap follows the item name, and fX is the gap after it.
; bAfterName = 0 = fX is a fixed position in the row.
bAfterName = 1
fX = 5.0

; Gap between the two keycaps of a combo.
fGap = 20.0

; Mark which hand the bind equips into: R, L, or both. Only for binds that remember a
; hand (see bRememberHand). fHandLabelSize is text size, fHandLabelGap the space after
; the keycap.
bShowHandLabel = 1
fHandLabelSize = 14.0
fHandLabelGap = 4.0


[IconsContainer]

; Container, barter and gift menus.
bShow = 1
fX = 5.0
fGap = 20.0


[IconsMagic]

bShow = 1
fX = 5.0
fGap = 20.0


[IconsFavorites]

bShow = 1
fX = 10.0
fGap = 20.0


[Gameplay]

; Remember which hand the entry was in when you bound it, and put it back there every
; press. Bound while holding a spell in both hands = one press fills both hands. Anything
; not equipped when you bound it has no hand remembered.
bRememberHand = 1


[Compatibility]

; When a save is loaded, move any hotkeys already sitting on the vanilla number keys 1-8
; onto this system and clear the vanilla slots. The entries stay favorited.
bMigrateVanillaHotkeys = 1


[Debug]

; Writes a lot of detail to SKSE/MMOHotbar.log. Only for chasing a bug --
; assignments and warnings are logged either way.
bDebugLog = 0


[Hotbar]

; TAP this key alone to flip the visible preset between 1 and 2.
; It is reserved as the toggle: it never forms part of a bound chord, and it can never be
; captured into one.
;
; The value is a KEYBOARD SCANCODE, not a character code: 45 is X. Set it to 0 to turn the
; toggle off entirely (the bar then always shows preset 1). Whatever you put here, the
; plugin logs what it resolved to BY NAME at start-up -- check MMOHotbar.log if the bar
; stops flipping, and if it warns that the key is also your assign or group modifier, pick
; a different one: a collision disables the toggle rather than the modifier.
;
; A few useful scancodes: A 30, C 46, E 18, G 34, Q 16, V 47, Z 44, F1 59, F2 60, F3 61,
; Home 74, End 77, Grave 41, 1 2, 2 3, 3 4. The start-up log line prints the resolved name,
; so you can confirm a value without memorising the table.
;
; Read once at start-up (kDataLoaded): edit this, then restart the game or load a save.
;
; Each preset is an independent 12-slot table of binds. The same physical key (F, Z,
; F1, Home, ...) can carry a different item in each preset; only the visible preset
; is resolved, so a displayed key equips exactly what the bar shows.
;
; Assignment follows what you see: with preset 2 showing, Ctrl+F stores F in
; preset 2 and leaves preset 1's binding on F untouched.
iPresetModifierScanCode = 45

; --- layout --------------------------------------------------------------------
; Read once at start-up (kDataLoaded): edit these, then restart the game or load a save.
;
; How many of the 12 slots the bar shows AND accepts. 1-12, default 12. The movie is
; always built with 12 slots -- the rest are hidden, not rebuilt -- so this needs no
; re-run of the SWF builder. Shrinking it hides slots that already hold a bind; those
; binds keep working on their own chord, they are simply not on the bar.
iVisibleSlots = 12

; Size, as a percentage of the bar as drawn (100 = as shipped, clamped to 25-400).
; The bar grows around its bottom-centre anchor, so this does not walk it sideways.
; NOTE the fBar prefix: [Icons] already has fScale/fX/fY, and those size the KEYCAPS on
; inventory list rows. These three size the bar itself.
fBarScale = 100

; Horizontal offset from the MIDDLE of the visible stage, in pixels.
; 0 = centred, -200 = 200 px to the left, +200 = to the right. Read against the stage
; the game reports, so the same number means the same thing at 16:9 and ultrawide.
fBarX = 0

; Height of the bar's BOTTOM edge above the bottom of the screen, in pixels.
; 0 = flush with the bottom edge, 96 = further up. Clamped to 0-768.
fBarY = 32

; Fill the slots from your own icon sheet (Interface/SkyUI/IconsItem_*.swf). DEFAULT OFF:
; it is twelve synchronous loadMovie() calls into a large external SWF, done on the HUD
; frame, and that cost was never measured. Turn it on, and if the game stutters when the
; bar first appears, turn it back off.
bShowItemIcons = 0

; The 12-slot bar itself. Set to 0 to leave the game's HUD menu completely alone -- the
; rest of the mod keeps working, there is just no bar. This is the first switch to try if
; the game misbehaves after loading a save or starting a new game.
bEnableHUD = 1

